[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llampaca"
version = "0.1.0"
description = "A llama.cpp based local AI agent assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "click>=8.1.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "openai>=1.12.0",
    "huggingface-hub>=0.20.0",
    "tabulate>=0.9.0",
    "aiosqlite>=0.20.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "mcp>=1.0.0",
    "numpy>=1.26.0",
]

[project.scripts]
llampaca = "llampaca.cli:main"
