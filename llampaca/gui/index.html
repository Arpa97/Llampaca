<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llampaca Dashboard</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!--
        Tre famiglie tipografiche, tre ruoli distinti:
          - Space Grotesk : titoli e intestazioni (voce "strumento di misura")
          - Inter         : testo di lettura e UI (invariato rispetto a prima)
          - JetBrains Mono: TUTTI i dati macchina (porte, file, quantizzazioni,
                            tok/s, nomi dei tool, percorsi di log, etichette)
        È il mono a dare carattere: Llampaca è un prodotto da terminale e i suoi
        dati devono sembrare dati, non prosa.
    -->
    <!-- Serviti da qui, non da fonts.gstatic.com: Llampaca gira in locale e
         deve funzionare senza rete. Licenze e provenienza in vendor/LICENSES.md. -->
    <link rel="stylesheet" href="vendor/fonts.css">

    <style>
        /* ==================================================================
           0. DESIGN TOKENS
           ------------------------------------------------------------------
           La palette del brand è INVARIATA. Quello che cambia sono i neutri:
           prima erano i grigi di GitHub (#f6f8fa / #e1e4e8 / #24292e), estranei
           alla palette. Ora sono virati verso --dusk-blue, così ambra e
           pacific-blue vivono dentro una famiglia coerente invece che sopra
           una presa in prestito.
           ================================================================== */
        :root {
            /* --- Palette cromatica ufficiale (invariata) --- */
            --amber-glow: #ffa630;
            --tea-green: #d7e8ba;
            --pacific-blue: #4da1a9;
            --dusk-blue: #2e5077;
            --crimson-violet: #611c35;

            /* --- Derivati del brand: tinte e inchiostri leggibili ---
               L'ambra puro sotto testo bianco dà un contrasto di ~2.1:1
               (illeggibile). Ogni superficie ambra usa quindi --amber-ink. */
            --amber-ink: #4a2a00;
            --amber-deep: #8a4f00;
            --amber-tint: #fff4e6;
            --amber-tint-2: #ffe8cc;
            --pacific-tint: #e9f4f5;
            --pacific-deep: #2c6f76;
            --green-ink: #4b6a1d;
            --green-tint: #eef5e2;
            --crimson-tint: #fbe9ee;

            /* --- Neutri raffreddati verso il dusk-blue --- */
            --bg-app: #eef2f6;
            --bg-sidebar: #f4f7fa;
            --bg-content: #ffffff;
            --bg-color: #ffffff;
            --bg-card: #ffffff;
            --bg-subtle: #f8fafc;
            --bg-hover: #eef3f8;
            --bg-sunken: #f2f6fa;
            --border-color: #dde5ed;
            --border-strong: #c3d1e0;
            --text-main: #1c2b3a;
            --text-color: #1c2b3a;
            --text-muted: #5f7286;
            --text-faint: #8496a8;

            /* Distruttivo: crimson-violet schiarito quanto basta per essere
               leggibile su bianco, invece di un rosso generico fuori palette. */
            --danger: #8f2140;
            --danger-tint: #fbe9ee;

            /* Alias usati dai componenti (prima non definiti: i pannelli
               risultavano trasparenti e col testo ereditato). */
            --btn-pacific: var(--pacific-blue);

            /* --- Forma --- */
            --r-xs: 5px;
            --r-sm: 7px;
            --r-md: 10px;
            --r-lg: 14px;
            --r-pill: 999px;

            /* --- Profondità: ombre fredde, tarate sul testo, non nere --- */
            --shadow-1: 0 1px 2px rgba(28, 43, 58, 0.05);
            --shadow-2: 0 4px 14px -4px rgba(28, 43, 58, 0.12);
            --shadow-3: 0 18px 44px -14px rgba(28, 43, 58, 0.30);
            --focus-ring: 0 0 0 3px rgba(255, 166, 48, 0.35);

            /* --- Metrica --- */
            --sidebar-width: 232px;
            --header-h: 64px;

            /* --- Tipografia --- */
            --font-stack: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-display: 'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        }

        /* ==================================================================
           1. RESET & BASE
           ================================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-stack);
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--text-main);
            background-color: var(--bg-app);
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        #app {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        ::selection {
            background: var(--amber-tint-2);
            color: var(--amber-ink);
        }

        /* Scrollbar sottile e in palette: le barre di sistema spezzavano
           il tono chiaro dei pannelli. */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cfdbe7;
            border: 3px solid transparent;
            background-clip: content-box;
            border-radius: var(--r-pill);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-strong);
            background-clip: content-box;
        }

        /* Anello di focus unico per tutta l'app: nessun controllo raggiungibile
           da tastiera resta invisibile. */
        :focus-visible {
            outline: 2px solid var(--amber-glow);
            outline-offset: 2px;
            border-radius: var(--r-xs);
        }

        code,
        pre,
        .mono,
        .wiki-textarea,
        .code-textarea {
            font-family: var(--font-mono);
            /* JetBrains Mono lega "->" in una freccia e "--" in un trattino
               lungo. In un blocco di codice sorgente il carattere mostrato deve
               essere quello scritto: legature disattivate ovunque. */
            font-variant-ligatures: none;
            font-feature-settings: "liga" 0, "calt" 0;
        }

        /* Etichetta macchina: minuscola, monospazio, spaziata. È il device
           strutturale ricorrente dell'app (gruppi di navigazione, intestazioni
           di sezione, colonne dati). */
        .eyebrow {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: var(--text-faint);
        }

        /* ==================================================================
           2. SIDEBAR
           ================================================================== */
        .sidebar {
            width: var(--sidebar-width);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 22px 14px 14px;
            flex-shrink: 0;
            height: 100%;
        }

        .brand {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0 8px 20px;
            margin-bottom: 4px;
        }

        .brand-logo {
            width: 100%;
            max-width: 132px;
            height: auto;
            display: block;
            /* Il PNG ha lo sfondo bianco opaco: su una sidebar tinta si vedeva
               come un rettangolo bianco intorno all'alpaca. Il multiply lascia
               passare il fondo senza dover ritagliare l'asset. */
            mix-blend-mode: multiply;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex-grow: 1;
            overflow-y: auto;
            margin: 0 -4px;
            padding: 0 4px;
        }

        /* La navigazione è raggruppata per ciò che le voci SONO, non elencata
           piatta: con chi parli / cosa sa fare / cosa lo fa girare. */
        .nav-group {
            margin-top: 18px;
            padding: 0 12px 7px;
        }

        .nav-group:first-child {
            margin-top: 0;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 8px 12px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: var(--r-sm);
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            position: relative;
            transition: background-color 0.14s ease, color 0.14s ease;
        }

        .nav-item:hover {
            background-color: var(--bg-hover);
            color: var(--dusk-blue);
        }

        /* Stato attivo: prima era una pillola ambra piena con testo bianco.
           Era il colore più forte della pagina applicato all'elemento meno
           azionabile — e competeva con i pulsanti primari, anch'essi ambra.
           Ora l'ambra è ridotta a un binario laterale: presente, non urlata. */
        .nav-item.active {
            background-color: var(--amber-tint);
            color: var(--dusk-blue);
            font-weight: 600;
        }

        .nav-item.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 7px;
            bottom: 7px;
            width: 3px;
            border-radius: var(--r-pill);
            background-color: var(--amber-glow);
        }

        .nav-item svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
            flex-shrink: 0;
            opacity: 0.75;
        }

        .nav-item.active svg {
            opacity: 1;
            fill: var(--amber-deep);
        }

        .nav-item-label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* --- Blocco di stato: dice cosa sta davvero girando --- */
        .sidebar-footer {
            margin-top: 14px;
            padding: 11px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--r-md);
            background-color: var(--bg-content);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .status-line {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--dusk-blue);
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            flex-shrink: 0;
            background-color: #86b23c;
            box-shadow: 0 0 0 3px rgba(134, 178, 60, 0.18);
        }

        .status-meta {
            font-family: var(--font-mono);
            font-size: 10.5px;
            line-height: 1.5;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .status-meta span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ==================================================================
           3. GUSCIO DELLE VISTE (header + body)
           Un solo header per tutte le viste: titolo display, sottotitolo
           facoltativo, azioni a destra. Prima ogni tab ne aveva una variante
           diversa scritta a mano inline.
           ================================================================== */
        .content-area {
            flex-grow: 1;
            background-color: var(--bg-content);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
            min-width: 0;
        }

        .view {
            display: flex;
            flex-direction: column;
            height: 100%;
            min-height: 0;
            position: relative;
        }

        .view-header {
            padding: 13px 26px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            min-height: var(--header-h);
            flex-shrink: 0;
            background-color: var(--bg-content);
        }

        .view-header-text {
            min-width: 0;
        }

        .view-title {
            font-family: var(--font-display);
            font-size: 18.5px;
            font-weight: 600;
            color: var(--dusk-blue);
            letter-spacing: -0.015em;
            line-height: 1.25;
        }

        .view-subtitle {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 2px;
            line-height: 1.4;
        }

        .view-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .view-body {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            background-color: var(--bg-subtle);
        }

        .view-body-pad {
            padding: 26px;
        }

        /* Larghezza di lettura massima per i contenuti a colonna singola. */
        .view-stack {
            max-width: 1180px;
        }

        /* Intestazione di sezione dentro una vista. Il margine superiore vive
           sull'intestazione, non sul blocco che la precede: così la spaziatura
           fra sezioni è la stessa qualunque cosa ci sia in mezzo (griglia,
           pannello vuoto, elenco). */
        .section-head {
            margin-top: 36px;
            margin-bottom: 14px;
        }

        .section-head:first-child {
            margin-top: 0;
        }

        .section-title {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 15px;
            color: var(--dusk-blue);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.01em;
        }

        /* Titolo di dettaglio che è un identificatore (nome di un tool), non
           una frase: prende il mono invece della display. */
        .section-title.mono {
            font-family: var(--font-mono);
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .section-desc {
            font-size: 12.5px;
            color: var(--text-muted);
            margin-top: 4px;
            max-width: 720px;
            line-height: 1.5;
        }

        /* Compatibilità: la vecchia classe resta valida, restilizzata. */
        .mcp-section-header {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 15px;
            color: var(--dusk-blue);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ==================================================================
           4. PULSANTI
           Un'unica definizione per variante (prima .btn-danger era dichiarato
           due volte e la seconda annullava silenziosamente la prima).
           ================================================================== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            padding: 8px 15px;
            border-radius: var(--r-sm);
            font-family: var(--font-stack);
            font-size: 12.5px;
            font-weight: 600;
            line-height: 1.2;
            cursor: pointer;
            border: 1px solid transparent;
            white-space: nowrap;
            transition: background-color 0.14s ease, border-color 0.14s ease, color 0.14s ease, box-shadow 0.14s ease;
        }

        .btn svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .btn:disabled,
        .btn[disabled] {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Primario: ambra con inchiostro scuro. Il testo bianco su #ffa630 non
           raggiungeva un contrasto leggibile; l'inchiostro scuro sì, e rende
           il pulsante più deciso. */
        .btn-primary {
            background-color: var(--amber-glow);
            color: var(--amber-ink);
            box-shadow: var(--shadow-1);
        }

        .btn-primary:hover:not(:disabled) {
            background-color: #ffb44f;
            box-shadow: 0 2px 8px rgba(255, 166, 48, 0.35);
        }

        .btn-primary:active:not(:disabled) {
            background-color: #f39a25;
        }

        .btn-secondary {
            background-color: var(--bg-content);
            border-color: var(--border-color);
            color: var(--dusk-blue);
        }

        .btn-secondary:hover:not(:disabled) {
            background-color: var(--bg-hover);
            border-color: var(--border-strong);
        }

        .btn-pacific {
            background-color: var(--pacific-blue);
            color: #ffffff;
            box-shadow: var(--shadow-1);
        }

        .btn-pacific:hover:not(:disabled) {
            background-color: var(--pacific-deep);
        }

        .btn-danger {
            background-color: var(--bg-content);
            border-color: #eccbd5;
            color: var(--danger);
        }

        .btn-danger:hover:not(:disabled) {
            background-color: var(--danger-tint);
            border-color: var(--danger);
        }

        .btn-ghost {
            background-color: transparent;
            color: var(--text-muted);
            border-color: transparent;
        }

        .btn-ghost:hover:not(:disabled) {
            background-color: var(--bg-hover);
            color: var(--dusk-blue);
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 11.5px;
        }

        .btn-block {
            width: 100%;
        }

        /* ==================================================================
           5. FORM
           ================================================================== */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-weight: 600;
            color: var(--dusk-blue);
            font-size: 12.5px;
        }

        .form-input,
        .download-input {
            padding: 9px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--r-sm);
            font-family: var(--font-stack);
            font-size: 13px;
            color: var(--text-main);
            background-color: var(--bg-content);
            outline: none;
            width: 100%;
            transition: border-color 0.14s ease, box-shadow 0.14s ease;
        }

        .form-input::placeholder,
        .download-input::placeholder {
            color: var(--text-faint);
        }

        .form-input:hover:not(:disabled),
        .download-input:hover:not(:disabled) {
            border-color: var(--border-strong);
        }

        .form-input:focus,
        .download-input:focus {
            border-color: var(--amber-glow);
            box-shadow: var(--focus-ring);
        }

        .form-input:disabled {
            background-color: var(--bg-sunken);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* I campi numerici sono dati macchina: monospazio, allineati. */
        .form-input[type="number"] {
            font-family: var(--font-mono);
            font-size: 13px;
        }

        .form-help {
            font-size: 11.5px;
            color: var(--text-muted);
            line-height: 1.45;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        select.download-input,
        select.form-input {
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath fill='%235f7286' d='M6 8.2 2.3 4.5l.9-.9L6 6.4l2.8-2.8.9.9z'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 10px center;
            padding-right: 30px;
        }

        .download-input-group {
            display: flex;
            gap: 10px;
        }

        .download-input-group .btn {
            flex-shrink: 0;
        }

        /* ==================================================================
           6. BADGE, CHIP, PILLOLE
           I badge sono etichette macchina: tutti in monospazio.
           ================================================================== */
        .model-badge {
            font-family: var(--font-mono);
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 3px 7px;
            border-radius: var(--r-xs);
            white-space: nowrap;
            background-color: var(--bg-sunken);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
        }

        .model-badge.success {
            background-color: var(--green-tint);
            color: var(--green-ink);
            border-color: #cfe0b4;
        }

        .model-badge.secondary {
            background-color: var(--bg-sunken);
            color: var(--text-muted);
            border-color: var(--border-color);
        }

        .model-badge.warning {
            background-color: var(--amber-tint);
            color: var(--amber-deep);
            border-color: var(--amber-tint-2);
        }

        .model-badge.info {
            background-color: var(--pacific-tint);
            color: var(--pacific-deep);
            border-color: #cbe4e6;
        }

        .badge-custom {
            background-color: var(--amber-tint);
            color: var(--amber-deep);
            border-color: var(--amber-tint-2);
        }

        .badge-mcp {
            background-color: var(--pacific-tint);
            color: var(--pacific-deep);
            border-color: #cbe4e6;
        }

        .badge-danger {
            background-color: var(--danger-tint);
            color: var(--danger);
            border-color: #eccbd5;
        }

        /* Frammento di comando / percorso / nome file. */
        .mono-chip,
        .mcp-command {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--text-muted);
            background-color: var(--bg-sunken);
            padding: 3px 7px;
            border-radius: var(--r-xs);
            border: 1px solid var(--border-color);
            word-break: break-all;
        }

        /* ==================================================================
           7. CARD E PANNELLI
           ================================================================== */
        .card,
        .model-card,
        .registry-card,
        .settings-card,
        .download-panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--r-md);
        }

        .model-card,
        .registry-card {
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: border-color 0.16s ease, box-shadow 0.16s ease;
        }

        .model-card:hover,
        .registry-card:hover {
            border-color: var(--border-strong);
        }

        .model-card.active {
            border-color: var(--amber-glow);
            box-shadow: inset 3px 0 0 var(--amber-glow);
        }

        .models-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(288px, 1fr));
            gap: 16px;
        }

        .registry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .model-card-header,
        .registry-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .model-card-title,
        .registry-card-name {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 14.5px;
            color: var(--dusk-blue);
            letter-spacing: -0.01em;
            line-height: 1.3;
            word-break: break-word;
        }

        /* Il nome file GGUF è un dato, non un titolo. */
        .model-card-file {
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--text-faint);
            word-break: break-all;
            margin-top: -6px;
        }

        .model-card-desc,
        .registry-card-desc {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.5;
            flex-grow: 1;
        }

        /* Meta: coppie etichetta/valore, valore in monospazio. */
        .model-card-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 18px;
            border-top: 1px solid var(--border-color);
            padding-top: 11px;
            font-size: 11px;
            color: var(--text-faint);
        }

        .model-card-meta strong {
            font-family: var(--font-mono);
            font-weight: 500;
            font-size: 11px;
            color: var(--text-main);
            margin-left: 5px;
        }

        .model-card-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
            padding-top: 4px;
        }

        .registry-card-link {
            font-size: 11.5px;
            color: var(--pacific-deep);
            text-decoration: none;
            font-weight: 600;
        }

        .registry-card-link:hover {
            text-decoration: underline;
        }

        .download-panel {
            padding: 20px;
            margin-bottom: 22px;
        }

        .download-panel-title {
            font-family: var(--font-display);
            font-size: 13.5px;
            font-weight: 600;
            color: var(--dusk-blue);
            margin-bottom: 10px;
        }

        .settings-container {
            max-width: 680px;
        }

        .settings-card {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Stato vuoto riquadrato: usato ovunque manchi un elenco. */
        .empty-panel {
            padding: 28px;
            text-align: center;
            color: var(--text-muted);
            background-color: var(--bg-content);
            border-radius: var(--r-md);
            border: 1px dashed var(--border-strong);
            font-size: 12.5px;
        }

        /* Elenco MCP */
        .mcp-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mcp-item {
            border: 1px solid var(--border-color);
            border-radius: var(--r-md);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background-color: var(--bg-card);
        }

        .mcp-details {
            display: flex;
            flex-direction: column;
            gap: 7px;
            min-width: 0;
        }

        .mcp-name {
            font-family: var(--font-display);
            font-weight: 600;
            color: var(--dusk-blue);
            font-size: 14px;
        }

        /* Barra di avanzamento download */
        .progress-bar-container {
            width: 100%;
            height: 5px;
            background-color: var(--bg-sunken);
            border-radius: var(--r-pill);
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background-color: var(--amber-glow);
            border-radius: var(--r-pill);
            transition: width 0.3s ease;
        }

        /* ==================================================================
           8. LAYOUT A DUE PANNELLI (Profilo, Strumenti, Skills)
           Un unico pattern condiviso invece di tre varianti scritte inline.
           ================================================================== */
        .wiki-container {
            flex: 1 1 auto;
            display: flex;
            min-height: 0;
            overflow: hidden;
        }

        .wiki-sidebar {
            width: 286px;
            flex-shrink: 0;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background-color: var(--bg-sidebar);
            min-height: 0;
        }

        .wiki-main {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            padding: 24px 26px;
            overflow-y: auto;
            background-color: var(--bg-subtle);
        }

        /* Intestazione delle colonne-elenco (conversazioni, pagine, tool…) */
        .chat-sidebar-header {
            padding: 12px 16px;
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.13em;
            color: var(--text-faint);
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .conversations-list {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        /* Voce d'elenco: piatta, senza card annidate. Prima ogni riga era una
           card bianca bordata dentro una colonna grigia — molto rumore per
           poca informazione. */
        .conversation-item {
            padding: 9px 11px;
            border-radius: var(--r-sm);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background-color: transparent;
            border: 1px solid transparent;
            position: relative;
            transition: background-color 0.14s ease;
        }

        .conversation-item:hover {
            background-color: var(--bg-hover);
        }

        .conversation-item.active {
            background-color: var(--bg-content);
            border-color: var(--border-color);
            box-shadow: var(--shadow-1);
        }

        .conversation-item.active::before {
            content: "";
            position: absolute;
            left: -8px;
            top: 8px;
            bottom: 8px;
            width: 3px;
            border-radius: var(--r-pill);
            background-color: var(--amber-glow);
        }

        .conversation-title {
            font-weight: 500;
            font-size: 13px;
            color: var(--dusk-blue);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* I nomi di tool e skill sono identificatori, non titoli: prendono il
           mono come ogni altro dato macchina nell'app. */
        .conversation-title.mono {
            font-size: 12px;
            letter-spacing: -0.01em;
        }

        .conversation-item.active .conversation-title {
            font-weight: 600;
        }

        .conversation-sub {
            font-size: 11px;
            color: var(--text-faint);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        .conversation-delete {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--r-xs);
            color: var(--text-faint);
            font-size: 15px;
            line-height: 1;
            opacity: 0;
            transition: opacity 0.14s ease, background-color 0.14s ease, color 0.14s ease;
        }

        .conversation-item:hover .conversation-delete,
        .conversation-item.active .conversation-delete,
        .conversation-delete:focus-visible {
            opacity: 1;
        }

        .conversation-delete:hover {
            background-color: var(--danger-tint);
            color: var(--danger);
        }

        .wiki-empty {
            margin: auto;
            max-width: 440px;
            text-align: center;
            color: var(--text-muted);
            padding: 24px;
        }

        .wiki-empty svg {
            width: 40px;
            height: 40px;
            fill: var(--border-strong);
            margin-bottom: 14px;
        }

        .wiki-empty h3 {
            font-family: var(--font-display);
            font-size: 16px;
            font-weight: 600;
            color: var(--dusk-blue);
            margin-bottom: 8px;
        }

        .wiki-empty p {
            font-size: 13px;
            line-height: 1.6;
        }

        .wiki-editor {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            min-height: 0;
            gap: 16px;
        }

        .wiki-textarea,
        .code-textarea {
            flex-grow: 1;
            min-height: 300px;
            resize: vertical;
            font-family: var(--font-mono);
            font-size: 12.5px;
            line-height: 1.6;
            padding: 12px;
            background-color: var(--bg-content);
        }

        .wiki-editor-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 10px;
            font-size: 11.5px;
            color: var(--text-muted);
        }

        /* Blocco di codice in sola lettura (sorgente tool / contenuto skill). */
        .code-block {
            border: 1px solid var(--border-color);
            border-radius: var(--r-md);
            background-color: var(--bg-sunken);
            overflow: hidden;
        }

        .code-block pre {
            margin: 0;
            padding: 14px;
            font-family: var(--font-mono);
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-main);
            overflow: auto;
            max-height: 340px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* Riquadro descrittivo con etichetta macchina. */
        .info-block {
            background-color: var(--bg-content);
            border: 1px solid var(--border-color);
            border-radius: var(--r-md);
            padding: 14px 16px;
        }

        .info-block h4 {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 7px;
        }

        .info-block p {
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-main);
        }

        /* Tabella parametri */
        .param-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 12.5px;
        }

        .param-table th {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--text-faint);
            padding: 0 10px 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .param-table td {
            padding: 10px 10px 10px 0;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
            line-height: 1.5;
        }

        .param-table td.t-mono {
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .param-table td.t-name {
            font-family: var(--font-mono);
            font-size: 12px;
            font-weight: 500;
            color: var(--dusk-blue);
        }

        /* ==================================================================
           9. CHAT
           ================================================================== */
        .chat-container {
            display: flex;
            width: 100%;
            flex: 1 1 auto;
            min-height: 0;
            overflow: hidden;
        }

        .chat-sidebar {
            width: 236px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background-color: var(--bg-sidebar);
            flex-shrink: 0;
            min-height: 0;
        }

        .chat-main {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-content);
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            position: relative;
        }

        .messages-list {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            padding: 28px 28px 8px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            background-color: var(--bg-subtle);
        }

        /* Il trascritto ha una misura di lettura: senza limite, su un desktop
           largo le risposte diventavano righe da 200 caratteri. */
        .messages-inner {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            animation: msgIn 0.18s ease-out;
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .message-row.user {
            align-self: flex-end;
            max-width: 82%;
            align-items: flex-end;
        }

        /* La risposta dell'assistente non è più un fumetto: è prosa a piena
           misura. Un fumetto stretto è giusto per una battuta, non per una
           risposta markdown lunga con codice, elenchi e tabelle.

           Due classi, non una: lo streaming dal vivo marca il turno come
           "agent", mentre una conversazione ricaricata da SQLite lo marca
           "assistant" (è il ruolo salvato nel database). Coprendone una sola,
           i messaggi storici perdevano lo stile. */
        .message-row.agent,
        .message-row.assistant {
            align-self: stretch;
            max-width: 100%;
        }

        .message-role {
            font-family: var(--font-mono);
            font-size: 9.5px;
            font-weight: 700;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: var(--text-faint);
            margin-bottom: 6px;
        }

        .message-bubble {
            line-height: 1.65;
            font-size: 13.5px;
            word-break: break-word;
        }

        .message-row.user .message-bubble {
            padding: 10px 15px;
            border-radius: var(--r-lg);
            border-bottom-right-radius: var(--r-xs);
            background-color: var(--amber-glow);
            color: var(--amber-ink);
            box-shadow: var(--shadow-1);
        }

        .message-row.agent .message-bubble,
        .message-row.assistant .message-bubble {
            background-color: transparent;
            border: none;
            padding: 0;
            color: var(--text-main);
        }

        .message-meta {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-faint);
            margin-top: 6px;
        }

        /* Riga "sto pensando": il puntino ambra pulsa, senza far ruotare uno
           spinner in mezzo al testo. */
        .message-thought {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12.5px;
            color: var(--amber-deep);
            margin-top: 2px;
        }

        .message-reasoning {
            margin: 6px 0 10px 0;
            padding: 8px 12px;
            background: rgba(245, 158, 11, 0.06);
            border-left: 3px solid var(--amber-glow);
            border-radius: 6px;
            font-size: 12.5px;
        }

        .reasoning-header {
            font-weight: 600;
            font-size: 12px;
            color: var(--amber-deep);
            margin-bottom: 4px;
            cursor: pointer;
            user-select: none;
        }

        .reasoning-content {
            font-family: var(--font-mono, monospace);
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-word;
            opacity: 0.85;
            max-height: 250px;
            overflow-y: auto;
            color: var(--text-muted, #71717a);
        }

        .thought-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--amber-glow);
            flex-shrink: 0;
            animation: pulse 1.1s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.35;
                transform: scale(0.7);
            }
        }

        /* --- Markdown nelle risposte --- */
        .markdown-body > *:last-child {
            margin-bottom: 0;
        }

        .markdown-body p {
            margin: 0 0 11px;
        }

        .markdown-body img {
            max-width: 100%;
            max-height: 480px;
            height: auto;
            border-radius: var(--r-md);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-2);
            margin: 12px 0;
            display: block;
            object-fit: contain;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
        }

        .markdown-body img:hover {
            transform: scale(1.01);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            font-family: var(--font-display);
            font-weight: 600;
            color: var(--dusk-blue);
            line-height: 1.3;
            margin: 18px 0 8px;
        }

        .markdown-body h1 { font-size: 17px; }
        .markdown-body h2 { font-size: 15.5px; }
        .markdown-body h3 { font-size: 14px; }
        .markdown-body h4 { font-size: 13px; }

        .markdown-body > h1:first-child,
        .markdown-body > h2:first-child,
        .markdown-body > h3:first-child {
            margin-top: 0;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin: 0 0 11px;
            padding-left: 20px;
        }

        .markdown-body li {
            margin-bottom: 4px;
        }

        .markdown-body li::marker {
            color: var(--text-faint);
        }

        .markdown-body strong {
            font-weight: 600;
            color: var(--dusk-blue);
        }

        .markdown-body a {
            color: var(--pacific-deep);
            text-decoration: underline;
            text-underline-offset: 2px;
        }

        .markdown-body code {
            font-family: var(--font-mono);
            font-size: 11.5px;
            background-color: var(--bg-sunken);
            border: 1px solid var(--border-color);
            padding: 1px 5px;
            border-radius: var(--r-xs);
            word-break: break-word;
        }

        .markdown-body pre {
            background-color: #1c2b3a;
            border-radius: var(--r-md);
            padding: 13px 15px;
            overflow-x: auto;
            margin: 0 0 12px;
        }

        .markdown-body pre code {
            font-family: var(--font-mono);
            font-size: 11.5px;
            line-height: 1.6;
            background: transparent;
            border: none;
            padding: 0;
            color: #e6edf5;
            white-space: pre;
        }

        .markdown-body blockquote {
            margin: 0 0 12px;
            padding: 2px 0 2px 14px;
            border-left: 3px solid #ffcb90;
            color: var(--text-muted);
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12.5px;
            margin: 0 0 12px;
            display: block;
            overflow-x: auto;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid var(--border-color);
            padding: 6px 10px;
            text-align: left;
        }

        .markdown-body th {
            background-color: var(--bg-sunken);
            font-weight: 600;
        }

        .markdown-body hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 16px 0;
        }

        /* Il fumetto utente è ambra: il codice inline dentro non può usare
           la superficie chiara di default. */
        .message-row.user .markdown-body code {
            background-color: rgba(74, 42, 0, 0.12);
            border-color: rgba(74, 42, 0, 0.18);
            color: var(--amber-ink);
        }

        .message-row.user .markdown-body strong {
            color: inherit;
        }

        /* --- Stato vuoto della chat --- */
        .chat-empty {
            margin: auto;
            text-align: center;
            max-width: 400px;
            padding: 20px;
        }

        .chat-empty img {
            width: 116px;
            margin-bottom: 6px;
            opacity: 0.9;
            /* Come .brand-logo: il PNG ha il fondo bianco opaco, che sulla
               superficie tenue del trascritto si vedeva come un riquadro. */
            mix-blend-mode: multiply;
        }

        .chat-empty h3 {
            font-family: var(--font-display);
            font-size: 17px;
            font-weight: 600;
            color: var(--dusk-blue);
            margin-bottom: 6px;
        }

        .chat-empty p {
            font-size: 12.5px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* --- Banner di autorizzazione ---
           Sta sopra il composer perché è bloccante: finché non rispondi,
           l'agente è fermo. Bordo ambra pieno, non un riquadro tra i tanti. */
        .confirm-banner {
            /* Stessa misura del trascritto e del composer: il banner appartiene
               alla colonna della conversazione, non alla larghezza della finestra. */
            width: 100%;
            max-width: 760px;
            margin: 0 auto 14px;
            padding: 14px 16px;
            background-color: var(--amber-tint);
            border: 1px solid var(--amber-glow);
            border-radius: var(--r-md);
            box-shadow: var(--shadow-2);
        }

        .confirm-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }

        .confirm-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--amber-ink);
        }

        .confirm-title svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }

        .confirm-title .tool-name {
            font-family: var(--font-mono);
            font-weight: 700;
        }

        .confirm-queue {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 700;
            background-color: var(--amber-glow);
            color: var(--amber-ink);
            padding: 2px 8px;
            border-radius: var(--r-pill);
            white-space: nowrap;
        }

        .confirmation-args {
            background-color: var(--bg-content);
            border: 1px solid var(--amber-tint-2);
            border-radius: var(--r-sm);
            padding: 10px 12px;
            margin-bottom: 12px;
            max-height: 210px;
            overflow: auto;
        }

        .confirmation-args pre {
            margin: 0;
            font-family: var(--font-mono);
            font-size: 11.5px;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text-main);
        }

        .confirmation-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* Rifiutare deve costare quanto consentire. Sul fondo ambra del banner
           il pulsante bianco a bordo chiaro sembrava disattivato: qui prende un
           bordo pieno, così le due scelte hanno lo stesso peso visivo. */
        .confirm-banner .btn-danger {
            border-color: var(--danger);
        }

        /* --- Composer --- */
        .chat-input-area {
            padding: 0 20px 16px;
            background-color: var(--bg-content);
            border-top: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .chat-input-inner {
            max-width: 760px;
            margin: 0 auto;
        }

        /* ---------- FIRMA: il misuratore di contesto ----------
           Prima: una frase grigia da 11px. Ora: uno strumento. La traccia si
           riempie d'ambra mentre la conversazione consuma la finestra di
           contesto e vira al crimson quando sta per esaurirsi. È la cosa più
           vera del prodotto — vedi la memoria della tua macchina riempirsi. */
        .ctx-meter {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 2px 10px;
            font-family: var(--font-mono);
            font-size: 10.5px;
            color: var(--text-muted);
        }

        .ctx-label {
            font-weight: 700;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            color: var(--text-faint);
            flex-shrink: 0;
        }

        .ctx-track {
            flex: 1 1 auto;
            min-width: 40px;
            height: 4px;
            border-radius: var(--r-pill);
            background-color: var(--bg-sunken);
            box-shadow: inset 0 0 0 1px var(--border-color);
            overflow: hidden;
        }

        .ctx-fill {
            height: 100%;
            background-color: var(--amber-glow);
            border-radius: var(--r-pill);
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s ease;
        }

        .ctx-pct {
            font-weight: 700;
            color: var(--amber-deep);
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        .ctx-stats {
            display: flex;
            gap: 12px;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .ctx-meter.warn .ctx-fill { background-color: #e8873a; }
        .ctx-meter.warn .ctx-pct { color: #b45f14; }
        .ctx-meter.crit .ctx-fill { background-color: var(--danger); }
        .ctx-meter.crit .ctx-pct { color: var(--danger); }

        .chat-input-box {
            display: flex;
            align-items: flex-end;
            border: 1px solid var(--border-color);
            border-radius: var(--r-lg);
            padding: 7px 8px 7px 10px;
            background-color: var(--bg-content);
            gap: 4px;
            box-shadow: var(--shadow-1);
            transition: border-color 0.14s ease, box-shadow 0.14s ease;
        }

        .chat-input-box:focus-within {
            border-color: var(--amber-glow);
            box-shadow: var(--focus-ring);
        }

        /* Multiriga con crescita automatica: Invio manda, Maiusc+Invio va a
           capo. Un <input> a riga singola non regge un prompt di tre frasi. */
        .chat-input-field {
            flex: 1 1 auto;
            min-width: 0;
            border: none;
            background: transparent;
            outline: none;
            resize: none;
            font-family: var(--font-stack);
            font-size: 13.5px;
            line-height: 1.5;
            color: var(--text-main);
            padding: 7px 6px;
            max-height: 168px;
            overflow-y: auto;
        }

        .chat-input-field::placeholder {
            color: var(--text-faint);
        }

        .icon-btn {
            border: none;
            background: transparent;
            cursor: pointer;
            color: var(--text-faint);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: var(--r-sm);
            transition: background-color 0.14s ease, color 0.14s ease;
        }

        .icon-btn svg {
            width: 18px;
            height: 18px;
        }

        .icon-btn:hover {
            background-color: var(--bg-hover);
            color: var(--dusk-blue);
        }

        /* Il flag 🧠 acceso: resta illuminato finché è armato. */
        .icon-btn.active {
            background-color: var(--amber-tint);
            color: var(--amber-deep);
        }

        .send-btn {
            background-color: var(--amber-glow);
            color: var(--amber-ink);
        }

        .send-btn:hover {
            background-color: #ffb44f;
            color: var(--amber-ink);
        }

        .stop-btn {
            background-color: var(--danger-tint);
            color: var(--danger);
        }

        .stop-btn:hover {
            background-color: #f6dbe3;
            color: var(--danger);
        }

        /* Il suggerimento sui tasti compare solo mentre scrivi: serve la prima
           volta, e dopo è rumore permanente in fondo alla schermata. */
        .composer-hint {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--text-faint);
            text-align: right;
            padding: 7px 4px 0;
            height: 0;
            opacity: 0;
            overflow: hidden;
            transition: opacity 0.16s ease;
        }

        .chat-input-box:focus-within ~ .composer-hint {
            height: auto;
            opacity: 1;
        }

        .composer-hint kbd {
            font-family: var(--font-mono);
            font-size: 9.5px;
            background-color: var(--bg-sunken);
            border: 1px solid var(--border-color);
            border-bottom-width: 2px;
            border-radius: var(--r-xs);
            padding: 1px 4px;
            color: var(--text-muted);
        }

        /* --- Allegati --- */
        .attachment-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
            margin-bottom: 9px;
        }

        .attachment-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            max-width: 100%;
            padding: 4px 9px;
            border-radius: var(--r-pill);
            background-color: var(--bg-sunken);
            border: 1px solid var(--border-color);
            font-size: 11.5px;
            color: var(--text-main);
        }

        .attachment-chip.uploading {
            opacity: 0.7;
        }

        .attachment-chip.error {
            background-color: var(--danger-tint);
            border-color: #eccbd5;
            color: var(--danger);
        }

        .attachment-chip .chip-name {
            font-family: var(--font-mono);
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 220px;
        }

        .attachment-chip .chip-detail {
            color: var(--text-faint);
            font-size: 10.5px;
        }

        .attachment-chip.error .chip-detail {
            color: var(--danger);
        }

        .attachment-chip .chip-remove {
            cursor: pointer;
            color: var(--text-faint);
            font-size: 14px;
            line-height: 1;
            padding-left: 2px;
        }

        .attachment-chip .chip-remove:hover {
            color: var(--text-main);
        }

        .drop-overlay {
            position: absolute;
            inset: 10px;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255, 244, 230, 0.85);
            backdrop-filter: blur(2px);
            border: 2px dashed var(--amber-glow);
            border-radius: var(--r-lg);
            pointer-events: none;
        }

        .drop-overlay-inner {
            padding: 12px 20px;
            border-radius: var(--r-md);
            background-color: var(--bg-content);
            border: 1px solid var(--amber-glow);
            color: var(--amber-ink);
            font-weight: 600;
            font-size: 13px;
            box-shadow: var(--shadow-2);
        }

        /* ==================================================================
           10. OVERLAY, MODALI, TOAST
           ================================================================== */
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
            gap: 14px;
            font-weight: 500;
            color: var(--dusk-blue);
            font-size: 14px;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border-color);
            border-top-color: var(--amber-glow);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            flex-shrink: 0;
        }

        .spinner-sm {
            width: 15px;
            height: 15px;
            border-width: 2px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .toast-notification {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background-color: var(--text-main);
            color: #ffffff;
            padding: 11px 18px;
            border-radius: var(--r-md);
            box-shadow: var(--shadow-3);
            font-size: 13px;
            font-weight: 500;
            z-index: 2000;
            max-width: 420px;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
            border-left: 3px solid var(--amber-glow);
        }

        .toast-notification.success {
            border-left-color: #86b23c;
        }

        .toast-notification.error {
            border-left-color: #e0637f;
        }

        @keyframes slideIn {
            from {
                transform: translateY(12px);
                opacity: 0;
            }

            to {
                transform: none;
                opacity: 1;
            }
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(28, 43, 58, 0.45);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
            animation: fadeIn 0.18s ease-out;
        }

        .modal-container {
            background: var(--bg-content);
            border: 1px solid var(--border-color);
            border-radius: var(--r-lg);
            width: 100%;
            max-width: 560px;
            max-height: 86vh;
            box-shadow: var(--shadow-3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: 15.5px;
            font-weight: 600;
            color: var(--dusk-blue);
        }

        .modal-close {
            background: transparent;
            border: none;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            color: var(--text-faint);
            width: 28px;
            height: 28px;
            border-radius: var(--r-sm);
            flex-shrink: 0;
        }

        .modal-close:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
        }

        .modal-footer {
            padding: 14px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            background: var(--bg-subtle);
            flex-shrink: 0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.97);
                opacity: 0;
            }

            to {
                transform: none;
                opacity: 1;
            }
        }

        /* Messaggio d'errore in un form. */
        .form-error {
            background-color: var(--danger-tint);
            border: 1px solid #eccbd5;
            color: var(--danger);
            padding: 11px 13px;
            border-radius: var(--r-sm);
            font-size: 12.5px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        /* ==================================================================
           11. RESPONSIVE
           Sotto i 940px la sidebar si riduce a un binario di sole icone; sotto
           i 720px le colonne-elenco laterali si comprimono e le griglie
           diventano a colonna singola.
           ================================================================== */
        @media (max-width: 940px) {
            .sidebar {
                width: 60px;
                padding: 16px 8px 10px;
                align-items: center;
            }

            .brand {
                padding: 0 0 14px;
            }

            .brand-logo {
                max-width: 34px;
            }

            .nav-group {
                display: none;
            }

            .nav-item {
                justify-content: center;
                padding: 9px 0;
                width: 44px;
            }

            .nav-item-label {
                display: none;
            }

            .nav-item.active::before {
                left: -4px;
            }

            /* Ridotto al solo pallino di stato: la cornice attorno a un pallino
               solitario sembrava un elemento rimasto lì per sbaglio. */
            .sidebar-footer {
                padding: 10px 0;
                align-items: center;
                border: none;
                background: transparent;
                border-top: 1px solid var(--border-color);
                border-radius: 0;
            }

            .status-line span,
            .status-meta {
                display: none;
            }

            .chat-sidebar,
            .wiki-sidebar {
                width: 190px;
            }
        }

        @media (max-width: 720px) {
            .view-header {
                padding: 12px 16px;
            }

            .view-body-pad,
            .wiki-main {
                padding: 18px 16px;
            }

            .messages-list {
                padding: 20px 16px 8px;
            }

            .chat-input-area {
                padding: 0 12px 12px;
            }

            .chat-sidebar,
            .wiki-sidebar {
                width: 148px;
            }

            .models-grid,
            .registry-grid,
            .form-row {
                grid-template-columns: 1fr;
            }

            .ctx-stats {
                display: none;
            }
        }

        /* ==================================================================
           12. MOVIMENTO RIDOTTO
           ================================================================== */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
            }
        }
    </style>
</head>

<body>

    <div id="app" v-cloak>
        <!-- Toast Notification -->
        <div v-if="toastMessage" class="toast-notification" :class="toastType">
            {{ toastMessage }}
        </div>

        <!-- ============================================================
             Sidebar: navigazione raggruppata + stato reale del server
             ============================================================ -->
        <aside class="sidebar">
            <div class="brand">
                <img class="brand-logo" src="logo.png" alt="Llampaca">
            </div>

            <nav class="nav-menu" role="tablist" aria-label="Sezioni">
                <div class="nav-group eyebrow">Assistente</div>
                <a class="nav-item" role="tab" tabindex="0" :aria-selected="currentTab === 'chat'"
                   :class="{ active: currentTab === 'chat' }" @click="currentTab = 'chat'"
                   @keyup.enter="currentTab = 'chat'" @keyup.space="currentTab = 'chat'" title="Chat & Assistente">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z" />
                    </svg>
                    <span class="nav-item-label">Chat</span>
                </a>
                <a class="nav-item" role="tab" tabindex="0" :aria-selected="currentTab === 'wiki'"
                   :class="{ active: currentTab === 'wiki' }" @click="currentTab = 'wiki'"
                   @keyup.enter="currentTab = 'wiki'" @keyup.space="currentTab = 'wiki'" title="Profilo — memoria personale">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                    </svg>
                    <span class="nav-item-label">Profilo</span>
                </a>

                <div class="nav-group eyebrow">Capacità</div>
                <a class="nav-item" role="tab" tabindex="0" :aria-selected="currentTab === 'tools'"
                   :class="{ active: currentTab === 'tools' }" @click="currentTab = 'tools'"
                   @keyup.enter="currentTab = 'tools'" @keyup.space="currentTab = 'tools'" title="Strumenti">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.3C.5 6.7.9 9.8 2.9 11.8c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.1z" />
                    </svg>
                    <span class="nav-item-label">Strumenti</span>
                </a>
                <a class="nav-item" role="tab" tabindex="0" :aria-selected="currentTab === 'skills'"
                   :class="{ active: currentTab === 'skills' }" @click="currentTab = 'skills'"
                   @keyup.enter="currentTab = 'skills'" @keyup.space="currentTab = 'skills'" title="Skills Markdown">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
                    </svg>
                    <span class="nav-item-label">Skills</span>
                </a>
                <a class="nav-item" role="tab" tabindex="0" :aria-selected="currentTab === 'mcp'"
                   :class="{ active: currentTab === 'mcp' }" @click="currentTab = 'mcp'"
                   @keyup.enter="currentTab = 'mcp'" @keyup.space="currentTab = 'mcp'" title="Integrazioni MCP">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z" />
                    </svg>
                    <span class="nav-item-label">Integrazioni</span>
                </a>

                <div class="nav-group eyebrow">Sistema</div>
                <a class="nav-item" role="tab" tabindex="0" :aria-selected="currentTab === 'clients'"
                   :class="{ active: currentTab === 'clients' }" @click="currentTab = 'clients'"
                   @keyup.enter="currentTab = 'clients'" @keyup.space="currentTab = 'clients'" title="Client IDE & Integrazioni">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/>
                    </svg>
                    <span class="nav-item-label">Client IDE</span>
                </a>
                <a class="nav-item" role="tab" tabindex="0" :aria-selected="currentTab === 'models'"
                   :class="{ active: currentTab === 'models' }" @click="currentTab = 'models'"
                   @keyup.enter="currentTab = 'models'" @keyup.space="currentTab = 'models'" title="Modelli GGUF">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" />
                    </svg>
                    <span class="nav-item-label">Modelli</span>
                </a>
                <a class="nav-item" role="tab" tabindex="0" :aria-selected="currentTab === 'settings'"
                   :class="{ active: currentTab === 'settings' }" @click="currentTab = 'settings'"
                   @keyup.enter="currentTab = 'settings'" @keyup.space="currentTab = 'settings'" title="Impostazioni">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z" />
                    </svg>
                    <span class="nav-item-label">Impostazioni</span>
                </a>
            </nav>

            <!-- Stato: mostra cosa sta davvero girando, non una stringa fissa.
                 I dati arrivano da /api/settings (config.json). -->
            <div class="sidebar-footer" :title="statusTitle">
                <div class="status-line">
                    <div class="status-dot"></div>
                    <span>Server locale</span>
                </div>
                <div class="status-meta">
                    <span>{{ activeModelShort }}</span>
                    <span>:{{ serverPort }} · ctx {{ contextLabel }}</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="content-area">
            <chat-view v-if="currentTab === 'chat'"></chat-view>
            <clients-view v-if="currentTab === 'clients'"></clients-view>
            <models-view v-if="currentTab === 'models'"></models-view>
            <mcp-view v-if="currentTab === 'mcp'"></mcp-view>
            <tools-view v-if="currentTab === 'tools'"></tools-view>
            <wiki-view v-if="currentTab === 'wiki'"></wiki-view>
            <skills-view v-if="currentTab === 'skills'"></skills-view>
            <settings-view v-if="currentTab === 'settings'"></settings-view>
        </main>
    </div>

    <!-- Librerie servite in locale (vedi vendor/LICENSES.md). Prima arrivavano
         da jsdelivr e unpkg: senza connessione Vue non si caricava e
         l'interfaccia restava un template grezzo non montato. -->
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/vue.global.prod.js"></script>
    <!-- Interceptor for opening local files/images in OS Finder/Explorer -->
    <script>
        document.addEventListener('click', function (e) {
            const a = e.target.closest('a');
            if (!a) return;
            const href = a.getAttribute('href');
            if (!href) return;

            if (href.startsWith('file://') || href.includes('/api/media?path=') || href.includes('/LlampacaDocs/') || /\.(png|jpg|jpeg|webp|gif|pdf|docx|txt)$/i.test(href)) {
                e.preventDefault();
                fetch('/api/open-file', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ path: href })
                }).catch(function(err) { console.error('Error opening file:', err); });
            }
        });
    </script>
    <!-- Frontend logic app.js (loaded as ES6 module) -->
    <script type="module" src="app.js"></script>
</body>

</html>
